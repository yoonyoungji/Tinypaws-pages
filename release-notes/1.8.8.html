<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TinyPaws 1.8.8 Release Notes</title>
  <style>.js [data-locale]{display:none}.js [data-locale].is-visible{display:block}</style>
</head>
<body>
  <section data-locale="ko">
    <h1>TinyPaws 1.8.8</h1>
    <ul><li>소품 상자를 밝은 디자인으로 바꾸고 글자를 더 크고 또렷하게 다듬었어요.</li></ul>
  </section>
  <section data-locale="en">
    <h1>TinyPaws 1.8.8</h1>
    <ul><li>Refreshed the accessory shelf with a brighter design and larger, easier-to-read labels.</li></ul>
  </section>
  <script>
    document.documentElement.classList.add("js");
    const locale = navigator.language || "en";
    const selectedLocale = locale.toLowerCase().startsWith("ko") ? "ko" : "en";
    document.querySelector('[data-locale="' + selectedLocale + '"]').classList.add("is-visible");
  </script>
</body>
</html>
